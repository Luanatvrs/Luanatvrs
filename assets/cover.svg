<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Luana Lorena, developer and applied AI, artistic portfolio banner">
<defs>
 <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191521"/><stop offset="1" stop-color="#302743"/></linearGradient>
 <linearGradient id="ribbon" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#B6A2FF"/><stop offset=".48" stop-color="#C9BAFF"/><stop offset="1" stop-color="#5035A5"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD8A8"/><stop offset=".4" stop-color="#FFAD88"/><stop offset="1" stop-color="#DC698A"/></linearGradient>
 <radialGradient id="orb" cx=".3" cy=".2"><stop stop-color="#FFF4DC"/><stop offset=".22" stop-color="#DCD1FF"/><stop offset=".7" stop-color="#9C85E8"/><stop offset="1" stop-color="#51359C"/></radialGradient>
 <filter id="drop" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
 <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#F8F3EF" opacity=".2"/></pattern>
 <clipPath id="edge"><rect width="1200" height="600" rx="26"/></clipPath>
</defs>
<g clip-path="url(#edge)">
<rect width="1200" height="600" fill="url(#surface)"/>
<path d="M752 -90Q1100 60 1220 392L1220 0Z" fill="#3C3158" opacity=".58"/>
<circle cx="1037" cy="280" r="259" fill="#302743" opacity=".75"/>
<rect x="777" y="40" width="400" height="490" fill="url(#dots)" opacity=".25"/>
<!-- editorial title -->
<g fill="#F8F3EF">
 <rect x="61" y="43" width="32" height="32" rx="8" fill="#B6A2FF"/>
 <text x="77" y="65" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="#22192E" text-anchor="middle">L</text>
 <text x="108" y="65" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3.6">LUANA / STUDIO</text>
 
 
 <text x="51" y="300" font-family="Georgia,'Times New Roman',serif" font-size="149" font-weight="bold" letter-spacing="-11">Luana</text>
 <text x="51" y="441" font-family="Georgia,'Times New Roman',serif" font-size="149" font-style="italic" letter-spacing="-11">Lorena<tspan fill="#FFAD88">.</tspan></text>
</g>
<path d="M60 475H674" stroke="#584867" stroke-width="2"/>
<text x="61" y="510" fill="#F8F3EF" font-family="Arial,sans-serif" font-size="17" font-weight="600">Software developer <tspan fill="#B6A2FF">+</tspan> AI enthusiast.</text>

